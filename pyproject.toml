[project]
name = "student-portal"
version = "0.1.0"
description = "Система управління студентами"
readme = "README.md"
authors = [
    { name = "vladyslav mishchuk", email = "vladmishchyk2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "django>=6.1.3",
    "djangorestframework>=3.18.3",
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
]

[project.scripts]
student-portal = "student_portal:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]

[tool.mypy]
strict = true

[tool.pytest]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = ["-ra"]
strict = true

[tool.coverage.run]
branch = true
source = ["student_portal", "students"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
